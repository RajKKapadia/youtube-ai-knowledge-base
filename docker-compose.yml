x-app-environment: &app-environment
  # Compose service names are the hostnames inside the Docker network.
  # These override the localhost URLs from .env without changing local runs.
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/youtube_kb
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: youtube_kb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youtube_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - video_data:/tmp/youtube-ai-knowledge-base/videos
      - model_cache:/tmp/youtube-ai-knowledge-base/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=info
      --concurrency=1
    volumes:
      - video_data:/tmp/youtube-ai-knowledge-base/videos
      - model_cache:/tmp/youtube-ai-knowledge-base/models
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  video_data:
  model_cache:
